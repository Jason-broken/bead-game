<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9d2">
  <title>我的拼豆工坊</title>
  <style>
    :root { --ink:#442f37; --paper:#fffaf5; --pink:#ff7c8f; --shadow:0 10px 28px #9a5b6420; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; background:radial-gradient(circle at 8% 10%,#ffe2ac 0 3px,transparent 4px),radial-gradient(circle at 90% 18%,#ffd0dc 0 4px,transparent 5px),#fff1e3; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .app { width:min(680px,100%); min-height:100vh; margin:auto; padding:max(18px,env(safe-area-inset-top)) 18px max(26px,env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    h1 { margin:0; font-size:clamp(22px,5vw,30px); letter-spacing:.03em; }
    .badge { background:#fff; border:2px solid #f7d5bd; border-radius:999px; padding:7px 11px; font-size:13px; font-weight:700; white-space:nowrap; }
    .board-wrap { height:min(644px,calc(100vw - 36px)); background:var(--paper); border:3px solid #fff; box-shadow:var(--shadow); border-radius:25px; padding:13px; overflow:auto; }
    canvas { width:100%; aspect-ratio:1; display:block; border-radius:16px; background:#f1d9c7; touch-action:none; }
    .hint { text-align:center; margin:12px 0 16px; color:#8d6c69; font-size:14px; }
    .panel { background:#fffaf5e8; border:2px solid #fff; border-radius:21px; box-shadow:var(--shadow); padding:14px; }
    .label { display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:14px; margin:0 3px 10px; }
    .current { font-weight:600; color:#966d70; }
    .board-options { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 14px; color:#75565a; font-weight:750; }
    .board-options input { width:56px; padding:7px 4px; border:2px solid #efd5c2; border-radius:10px; background:#fff; color:var(--ink); text-align:center; font:inherit; }
    .board-options button { border:0; border-radius:10px; padding:8px 12px; background:#64424a; color:#fff; font-weight:800; }
    .zoom-controls { display:flex; justify-content:center; align-items:center; gap:9px; margin:12px 0 2px; }
    .zoom-controls button { width:38px; height:34px; border:0; border-radius:10px; background:#fff; box-shadow:0 2px 5px #9a5b6425; font-weight:900; font-size:19px; }
    .zoom-controls input { width:68px; height:34px; border:2px solid #efd5c2; border-radius:10px; background:#fff; color:#75565a; text-align:center; font:inherit; font-size:14px; font-weight:800; }
    .palette { display:grid; grid-template-columns:repeat(8,1fr); gap:9px; max-height:270px; overflow:auto; padding:4px; }
    .color { appearance:none; width:100%; aspect-ratio:1; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 5px #57333a33; padding:0; position:relative; font-size:12px; font-weight:900; letter-spacing:-.04em; }
    .color.selected { outline:3px solid var(--ink); outline-offset:2px; transform:translateY(-1px); }
    .tools { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:12px 0; }
    .tool { min-height:49px; border:0; border-radius:14px; background:#fff; box-shadow:0 3px 8px #9a5b641d; font-weight:750; font-size:14px; }
    .tool:active,.color:active { transform:scale(.96); }
    .tool.active { background:#64424a; color:white; }
    .tool.danger { color:#b94257; }
    .import { width:100%; min-height:50px; margin-top:10px; border:2px dashed #e5af97; border-radius:14px; background:#fff5ed; color:#875159; font-weight:850; font-size:15px; }
    .export-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    .save { min-height:50px; border:0; border-radius:14px; font-weight:850; font-size:14px; color:white; background:linear-gradient(135deg,#ff8292,#ee5c79); box-shadow:0 7px 14px #e85e7750; }
    .save.all { grid-column:1 / -1; min-height:52px; font-size:16px; background:linear-gradient(135deg,#64424a,#8d5b67); }
    .save:active { transform:translateY(1px); }
    .toast { min-height:20px; margin:12px 0 0; text-align:center; color:#966d70; font-size:14px; font-weight:600; }
    .export-preview { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:18px; background:#442f3788; }
    .export-preview[hidden] { display:none; }
    .preview-card { width:min(680px,100%); max-height:92vh; overflow:auto; padding:18px; border-radius:22px; background:#fffaf5; box-shadow:0 16px 44px #2d1f244d; }
    .preview-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .preview-head strong { font-size:17px; }
    .preview-close { width:36px; height:36px; border:0; border-radius:50%; background:#f1ded2; font-size:22px; line-height:1; }
    .preview-note { margin:0 0 13px; color:#8d6c69; font-size:13px; line-height:1.5; }
    .preview-images { display:grid; gap:14px; }
    .preview-item { border:1px solid #efd5c2; border-radius:14px; overflow:hidden; background:#fff; }
    .preview-item img { width:100%; display:block; }
    .preview-item a { display:block; padding:10px; color:#7d3f4c; text-align:center; font-weight:800; text-decoration:none; }
    .crop-editor { position:fixed; z-index:11; inset:0; display:grid; place-items:center; padding:18px; background:#442f3788; }
    .crop-editor[hidden] { display:none; }
    .crop-card { width:min(520px,100%); padding:18px; border-radius:22px; background:#fffaf5; box-shadow:0 16px 44px #2d1f244d; }
    .crop-card h2 { margin:0 0 5px; font-size:19px; }
    .crop-card p { margin:0 0 14px; color:#8d6c69; font-size:13px; line-height:1.5; }
    #cropCanvas { display:block; width:min(100%,400px); aspect-ratio:1; margin:auto; border-radius:14px; background:#eee2d7; touch-action:none; }
    .crop-control { display:flex; align-items:center; gap:10px; margin:15px 0; color:#75565a; font-size:14px; font-weight:800; }
    .crop-control input { flex:1; accent-color:#ff7c8f; }
    .crop-actions { display:grid; grid-template-columns:1fr 1.35fr; gap:9px; }
    .crop-actions button { min-height:46px; border:0; border-radius:13px; font:inherit; font-weight:850; }
    .crop-cancel { background:#f1ded2; color:#76555b; }
    .crop-apply { background:linear-gradient(135deg,#ff8292,#ee5c79); color:#fff; }
    @media (max-width:380px) { .app{padding-left:12px;padding-right:12px}.board-wrap{height:calc(100vw - 24px)}.palette{gap:7px}.tools{gap:7px}.tool{font-size:13px} }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>我的拼豆工坊</h1><span class="badge" id="count">0 / 256 顆</span></header>
    <section class="board-wrap" id="boardWrap"><canvas id="board" aria-label="16乘16拼豆創作板"></canvas></section>
    <div class="tools" aria-label="編輯工具">
      <button class="tool" id="eraser">橡皮擦</button>
      <button class="tool" id="undo">↶ 復原</button>
      <button class="tool" id="redo">↷ 重做</button>
      <button class="tool danger" id="clear">清空</button>
    </div>
    <div class="zoom-controls" aria-label="拼豆板縮放"><button id="zoomOut" aria-label="縮小">−</button><input id="zoomInput" type="number" min="100" max="1000" step="25" value="100" inputmode="numeric" aria-label="縮放百分比"><button id="zoomIn" aria-label="放大">＋</button></div>
    <p class="hint">輕點方格放上拼豆；放大後可單指拖曳移動畫面</p>
    <section class="panel">
      <div class="board-options" aria-label="拼豆板大小">
        <span>方格板</span><input id="boardSize" type="number" min="4" max="256" value="16" inputmode="numeric" aria-label="每邊格數"><span>×</span><span id="boardSizeText">16</span>
        <button id="resizeBoard">套用</button>
      </div>
      <div class="label"><span id="paletteTitle">MARD 色號</span><span class="current" id="current">載入中…</span></div>
      <div class="palette" id="palette"></div>
      <button class="import" id="importImage" type="button">從照片轉成 MARD 色號圖</button>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <div class="export-actions" aria-label="選擇要儲存的圖片">
        <button class="save" id="saveArtwork">儲存作品圖</button>
        <button class="save" id="saveChart">儲存座標色號圖</button>
        <button class="save all" id="saveBoth">兩種都儲存</button>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </section>
  </main>
  <script>
    let size = 16;
    let colors = [
      ['#f15e6e','珊瑚紅'],['#ff9f43','橘子'],['#ffd75f','檸檬黃'],['#8dca6d','青草綠'],
      ['#55baca','湖水藍'],['#6487dc','晴空藍'],['#9c78d1','葡萄紫'],['#f39bc3','草莓粉'],
      ['#f7efe2','奶油白'],['#bc987c','牛奶茶'],['#6d5960','深灰色'],['#332d33','黑色']
    ];
    const canvas = document.querySelector('#board'), ctx = canvas.getContext('2d');
    const palette = document.querySelector('#palette'), current = document.querySelector('#current');
    const count = document.querySelector('#count'), toast = document.querySelector('#toast');
    const boardSizeInput = document.querySelector('#boardSize'), boardSizeText = document.querySelector('#boardSizeText');
    const boardWrap = document.querySelector('#boardWrap'), zoomInput = document.querySelector('#zoomInput');
    const STORAGE_KEY = 'mard-bead-workshop-v1', MAX_ZOOM=10, MAX_BOARD_DISPLAY_PX=4096;
    let grid = Array(size * size).fill(null), selected = 0, erase = false, history = [], future = [], zoom = 1;
    const pointers=new Map(); let pinching=false, pinchStartDistance=0, pinchStartZoom=1;
    let panning=false, panPointerId=null, panStart=null, panLast=null;
    function saveProject() {
      try { localStorage.setItem(STORAGE_KEY,JSON.stringify({size,grid,zoom,selectedHex:colors[selected]?.[0]})); } catch (_) {}
    }
    function restoreProject() {
      try {
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Number.isInteger(saved.size) || saved.size<4 || saved.size>256 || !Array.isArray(saved.grid) || saved.grid.length!==saved.size*saved.size) return false;
        size=saved.size; grid=saved.grid.map(v=>typeof v==='string'?v:null); zoom=Math.max(1,Math.min(MAX_ZOOM,Number(saved.zoom)||1));
        const found=colors.findIndex(c=>c[0]===saved.selectedHex); if(found>=0) selected=found;
        boardSizeInput.value=size; boardSizeText.textContent=size; zoomInput.value=Math.round(zoom*100); canvas.style.width=`${zoom*100}%`;
        canvas.setAttribute('aria-label',`${size}乘${size}拼豆創作板`); return true;
      } catch (_) { return false; }
    }
    function resize() { const px = Math.min(1024, Math.max(512, Math.round(canvas.clientWidth * devicePixelRatio))); canvas.width = canvas.height = px; draw(); }
    function maxZoomForDisplay() {
      // 以方格板在 100% 時的寬度推算，避免放大後的元素超過 4096px 而耗盡手機記憶體。
      const baseWidth=Math.max(1,boardWrap.clientWidth-26);
      return Math.max(1,Math.min(MAX_ZOOM,MAX_BOARD_DISPLAY_PX/baseWidth));
    }
    function setZoom(next, shouldSave=true) {
      const maxZoom=maxZoomForDisplay(), nextZoom=Math.max(1,Math.min(maxZoom,next)), reachedLimit=next>maxZoom && zoom===maxZoom;
      zoom=nextZoom; canvas.style.width=`${zoom*100}%`; zoomInput.value=Math.round(zoom*100); if(shouldSave) saveProject();
      if(reachedLimit && shouldSave) { toast.textContent='已達方格板可顯示的最大尺寸'; setTimeout(()=>toast.textContent='',1800); }
      requestAnimationFrame(resize);
    }
    function draw() {
      const w = canvas.width, cell = w / size; ctx.clearRect(0,0,w,w);
      ctx.fillStyle='#efd5c2'; ctx.fillRect(0,0,w,w);
      for (let y=0;y<size;y++) for(let x=0;x<size;x++) {
        const i=y*size+x, left=x*cell, top=y*cell;
        ctx.fillStyle='#e5c6b2'; ctx.fillRect(left,top,cell,cell);
        if (grid[i]) bead(left,top,cell,grid[i]);
        else { ctx.fillStyle='#f7e4d4'; ctx.fillRect(left,top,cell,cell); }
      }
      // 清楚的方格線：放上拼豆後仍能辨識每一個格子的位置。
      ctx.beginPath();
      for(let i=0;i<=size;i++) { const p=i*cell; ctx.moveTo(p,0); ctx.lineTo(p,w); ctx.moveTo(0,p); ctx.lineTo(w,p); }
      ctx.strokeStyle='#9b7267'; ctx.globalAlpha=.75; ctx.lineWidth=Math.max(1,w/500); ctx.stroke(); ctx.globalAlpha=1;
      count.textContent = `${grid.filter(Boolean).length} / ${size*size} 顆`;
    }
    function shade(hex, amount) {
      const n=parseInt(hex.slice(1),16), clamp=v=>Math.max(0,Math.min(255,v));
      return '#'+[n>>16,(n>>8)&255,n&255].map(v=>clamp(v+amount).toString(16).padStart(2,'0')).join('');
    }
    function bead(x,y,c,color) {
      // 每顆嚴格填滿一個格子：不超界、不留縫；中央是圓形孔洞。
      const cx=x+c/2, cy=y+c/2, hole=c*.205;
      const plastic=ctx.createLinearGradient(x,y,x+c,y+c);
      plastic.addColorStop(0,shade(color,42)); plastic.addColorStop(.42,color); plastic.addColorStop(1,shade(color,-36));
      ctx.fillStyle=plastic; ctx.fillRect(x,y,c,c);
      ctx.fillStyle='#ffffff38'; ctx.fillRect(x+c*.055,y+c*.055,c*.89,c*.07);
      ctx.beginPath(); ctx.arc(cx,cy,hole*1.42,0,Math.PI*2); ctx.fillStyle=shade(color,-52); ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,hole*1.05,0,Math.PI*2); ctx.fillStyle='#9d7e70'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,hole*.68,0,Math.PI*2); ctx.fillStyle='#f5dfce'; ctx.fill();
    }
    function choose(index) { selected=index; erase=false; [...palette.children].forEach((b,i)=>b.classList.toggle('selected',i===index)); document.querySelector('#eraser').classList.remove('active'); current.textContent=colors[index][1]; saveProject(); }
    function textColor(hex) { const n=parseInt(hex.slice(1),16), l=((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000; return l>155?'rgba(58,43,47,.52)':'rgba(255,255,255,.58)'; }
    function renderPalette() {
      palette.innerHTML='';
      colors.forEach((c,i)=>{ const b=document.createElement('button'); b.className='color'; b.style.background=c[0]; b.style.color=textColor(c[0]); b.textContent=c[1]; b.ariaLabel=`MARD ${c[1]}`; b.title=`MARD ${c[1]}：${c[0]}`; b.onclick=()=>choose(i); palette.append(b); });
    }
    async function loadMardPalette() {
      try {
        const response=await fetch('https://raw.githubusercontent.com/HansBug/pindou-color-data/main/mard-221-alfonse-doudou/colors.json');
        const data=await response.json();
        if (!Array.isArray(data.colors) || data.colors.length<200) throw new Error('色卡資料不完整');
        const activeHex=colors[selected]?.[0]; colors=data.colors.map(c=>[c.hex,c.code]); renderPalette(); choose(Math.max(0,colors.findIndex(c=>c[0]===activeHex)));
        document.querySelector('#paletteTitle').textContent=`MARD ${colors.length} 色`;
        toast.textContent=`已載入 MARD ${colors.length} 色完整色卡`;
        setTimeout(()=>toast.textContent='',2600);
      } catch (_) {
        current.textContent=colors[selected][1];
        toast.textContent='完整色卡暫時無法載入，先使用基本色盤。';
      }
    }
    function record(next) { history.push(grid.slice()); if(history.length>80) history.shift(); grid=next; future=[]; saveProject(); draw(); }
    function nearestMardColor(red,green,blue) {
      let closest=colors[0][0], shortest=Infinity;
      for(const [hex] of colors) {
        const value=parseInt(hex.slice(1),16), r=value>>16, g=(value>>8)&255, b=value&255;
        // 人眼對綠色更敏感，因此在比對時提高綠色的權重。
        const distance=2*(red-r)**2+4*(green-g)**2+3*(blue-b)**2;
        if(distance<shortest) { shortest=distance; closest=hex; }
      }
      return closest;
    }
    let cropState=null, cropDragging=false, cropLastPoint=null;
    function cropEditor() {
      let modal=document.querySelector('#cropEditor');
      if(modal) return modal;
      modal=document.createElement('div'); modal.id='cropEditor'; modal.className='crop-editor'; modal.hidden=true;
      modal.innerHTML='<section class="crop-card" role="dialog" aria-modal="true" aria-label="選取照片範圍"><h2>選取照片範圍</h2><p>拖曳照片選位置，再調整滑桿決定要取用的範圍大小。</p><canvas id="cropCanvas" width="640" height="640"></canvas><label class="crop-control"><span>選取大小</span><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1"><output id="cropZoomText">100%</output></label><div class="crop-actions"><button class="crop-cancel" type="button">取消</button><button class="crop-apply" type="button">套用並轉色號圖</button></div></section>';
      const close=()=>{ modal.hidden=true; cropState=null; document.querySelector('#imageInput').value=''; };
      modal.querySelector('.crop-cancel').onclick=close;
      modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
      modal.querySelector('#cropZoom').addEventListener('input',e=>{
        if(!cropState) return; cropState.scale=cropState.minScale*Number(e.target.value); clampCrop(); drawCropPreview();
      });
      modal.querySelector('.crop-apply').onclick=applyImageCrop;
      const preview=modal.querySelector('#cropCanvas');
      preview.addEventListener('pointerdown',e=>{ if(!cropState) return; preview.setPointerCapture(e.pointerId); cropDragging=true; cropLastPoint={x:e.clientX,y:e.clientY}; });
      preview.addEventListener('pointermove',e=>{
        if(!cropDragging || !cropState) return; cropState.x+=(e.clientX-cropLastPoint.x)*(640/preview.getBoundingClientRect().width); cropState.y+=(e.clientY-cropLastPoint.y)*(640/preview.getBoundingClientRect().height); cropLastPoint={x:e.clientX,y:e.clientY}; clampCrop(); drawCropPreview();
      });
      preview.addEventListener('pointerup',()=>cropDragging=false); preview.addEventListener('pointercancel',()=>cropDragging=false);
      document.body.append(modal); return modal;
    }
    function clampCrop() {
      const edge=640, width=cropState.image.naturalWidth*cropState.scale, height=cropState.image.naturalHeight*cropState.scale;
      cropState.x=Math.min(0,Math.max(edge-width,cropState.x)); cropState.y=Math.min(0,Math.max(edge-height,cropState.y));
    }
    function drawCropPreview() {
      const modal=document.querySelector('#cropEditor'), preview=modal.querySelector('#cropCanvas'), c=preview.getContext('2d'), edge=640;
      c.fillStyle='#efe4d9'; c.fillRect(0,0,edge,edge); c.drawImage(cropState.image,cropState.x,cropState.y,cropState.image.naturalWidth*cropState.scale,cropState.image.naturalHeight*cropState.scale);
      c.beginPath(); for(let i=1;i<3;i++) { const p=edge*i/3; c.moveTo(p,0); c.lineTo(p,edge); c.moveTo(0,p); c.lineTo(edge,p); } c.strokeStyle='#ffffffa8'; c.lineWidth=2; c.stroke(); c.strokeStyle='#fff'; c.lineWidth=5; c.strokeRect(0,0,edge,edge);
      const value=Number(modal.querySelector('#cropZoom').value); modal.querySelector('#cropZoomText').textContent=`${Math.round(100/value)}%`;
    }
    function convertImageToGrid(file) {
      if(!file || !file.type.startsWith('image/')) return;
      const image=new Image(), url=URL.createObjectURL(file);
      image.onload=()=>{
        URL.revokeObjectURL(url); const edge=640, minScale=Math.max(edge/image.naturalWidth,edge/image.naturalHeight);
        cropState={image,minScale,scale:minScale,x:(edge-image.naturalWidth*minScale)/2,y:(edge-image.naturalHeight*minScale)/2};
        const modal=cropEditor(); modal.querySelector('#cropZoom').value=1; modal.hidden=false; drawCropPreview();
      };
      image.onerror=()=>{ URL.revokeObjectURL(url); document.querySelector('#imageInput').value=''; toast.textContent='這張圖片無法讀取，請換一張再試。'; };
      image.src=url;
    }
    function applyImageCrop() {
      if(!cropState) return;
      if(grid.some(Boolean) && !confirm(`要將照片轉為 ${size} × ${size} 的色號圖嗎？目前作品會被取代。`)) return;
      const sample=document.createElement('canvas'), s=sample.getContext('2d',{willReadFrequently:true}), edge=640; sample.width=size; sample.height=size;
      s.drawImage(cropState.image,cropState.x*size/edge,cropState.y*size/edge,cropState.image.naturalWidth*cropState.scale*size/edge,cropState.image.naturalHeight*cropState.scale*size/edge);
      const pixels=s.getImageData(0,0,size,size).data, next=Array(size*size);
      for(let i=0;i<next.length;i++) { const p=i*4; next[i]=pixels[p+3]<32 ? null : nearestMardColor(pixels[p],pixels[p+1],pixels[p+2]); }
      document.querySelector('#cropEditor').hidden=true; cropState=null; document.querySelector('#imageInput').value=''; record(next);
      toast.textContent=`已轉成 ${size} × ${size} MARD 色號圖！`; setTimeout(()=>toast.textContent='',2800);
    }
    function paint(e) { const r=canvas.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)/r.width*size), y=Math.floor((e.clientY-r.top)/r.height*size); if(x<0||y<0||x>=size||y>=size)return; const i=y*size+x, value=erase?null:colors[selected][0]; if(grid[i]===value)return; const next=grid.slice(); next[i]=value; record(next); }
    function pointerDistance() { const pts=[...pointers.values()]; return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); }
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault(); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===1) { panPointerId=e.pointerId; panStart={x:e.clientX,y:e.clientY}; panLast=panStart; panning=false; }
      if(pointers.size===2) { pinching=true; panning=false; pinchStartDistance=pointerDistance(); pinchStartZoom=zoom; }
    });
    canvas.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===2 && pinchStartDistance) { e.preventDefault(); setZoom(pinchStartZoom*(pointerDistance()/pinchStartDistance),false); }
      else if(pointers.size===1 && e.pointerId===panPointerId) {
        const distance=Math.hypot(e.clientX-panStart.x,e.clientY-panStart.y);
        if(distance>6) panning=true;
        if(panning) { boardWrap.scrollLeft-=e.clientX-panLast.x; boardWrap.scrollTop-=e.clientY-panLast.y; }
        panLast={x:e.clientX,y:e.clientY};
      }
    });
    function finishPointer(e) {
      const wasPinching=pinching, wasPanning=panning; pointers.delete(e.pointerId);
      if(wasPinching) { if(!pointers.size) { pinching=false; saveProject(); } return; }
      if(!pointers.size) { if(!wasPanning) paint(e); panning=false; panPointerId=null; panStart=null; panLast=null; }
    }
    canvas.addEventListener('pointerup',finishPointer);
    canvas.addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); if(!pointers.size) { pinching=false; panning=false; panPointerId=null; } });
    document.querySelector('#eraser').onclick=()=>{ erase=!erase; document.querySelector('#eraser').classList.toggle('active',erase); [...palette.children].forEach(b=>b.classList.remove('selected')); current.textContent=erase?'橡皮擦':colors[selected][1]; };
    document.querySelector('#undo').onclick=()=>{ if(!history.length)return; future.push(grid.slice()); grid=history.pop(); saveProject(); draw(); };
    document.querySelector('#redo').onclick=()=>{ if(!future.length)return; history.push(grid.slice()); grid=future.pop(); saveProject(); draw(); };
    document.querySelector('#clear').onclick=()=>{ if(grid.every(v=>!v))return; if(confirm('確定要清空這張拼豆作品嗎？')) record(Array(size*size).fill(null)); };
    document.querySelector('#importImage').onclick=()=>document.querySelector('#imageInput').click();
    document.querySelector('#imageInput').addEventListener('change',e=>convertImageToGrid(e.target.files[0]));
    document.querySelector('#resizeBoard').onclick=()=>{
      const next = Math.max(4,Math.min(256,Math.round(Number(boardSizeInput.value)||size)));
      boardSizeInput.value=next;
      if(next===size)return;
      if(grid.some(Boolean) && !confirm(`要換成 ${next} × ${next} 的方格板嗎？目前作品會清空。`)) { boardSizeInput.value=size; return; }
      size=next; grid=Array(size*size).fill(null); history=[]; future=[]; boardSizeText.textContent=size; canvas.setAttribute('aria-label',`${size}乘${size}拼豆創作板`); saveProject(); draw();
    };
    document.querySelector('#zoomOut').onclick=()=>setZoom(zoom-.25);
    document.querySelector('#zoomIn').onclick=()=>setZoom(zoom+.25);
    zoomInput.addEventListener('change',()=>setZoom((Number(zoomInput.value)||100)/100));
    function downloadCanvas(source, filename) {
      const a=document.createElement('a'); a.download=filename; a.href=source.toDataURL('image/png'); a.click();
    }
    function showExportPreview(items) {
      let modal=document.querySelector('#exportPreview');
      if(!modal) {
        modal=document.createElement('div'); modal.id='exportPreview'; modal.className='export-preview'; modal.hidden=true;
        modal.innerHTML='<section class="preview-card" role="dialog" aria-modal="true" aria-label="作品圖片預覽"><div class="preview-head"><strong>圖片已生成</strong><button class="preview-close" type="button" aria-label="關閉">×</button></div><p class="preview-note">手機上可直接長按圖片儲存；也可點下方文字下載。</p><div class="preview-images"></div></section>';
        modal.querySelector('.preview-close').onclick=()=>{ modal.hidden=true; document.body.style.overflow=''; };
        modal.addEventListener('click',e=>{ if(e.target===modal) { modal.hidden=true; document.body.style.overflow=''; } });
        document.body.append(modal);
      }
      const list=modal.querySelector('.preview-images'); list.innerHTML='';
      modal.querySelector('.preview-note').textContent=items.length>1
        ? '手機會依序顯示所有圖稿；請逐張長按圖片儲存，或點各圖下方的下載文字。'
        : '手機上可直接長按圖片儲存；也可點下方文字下載。';
      items.forEach(({canvas,filename,label})=>{
        const url=canvas.toDataURL('image/png'), item=document.createElement('div'), image=document.createElement('img'), link=document.createElement('a');
        item.className='preview-item'; image.src=url; image.alt=label; link.href=url; link.download=filename; link.textContent=`下載：${label}`;
        item.append(image,link); list.append(item);
      });
      modal.querySelector('.preview-card').scrollTop=0;
      modal.hidden=false; document.body.style.overflow='hidden';
    }
    function colorLabel(hex) {
      const found=colors.find(c=>c[0].toLowerCase()===hex.toLowerCase());
      return found ? found[1] : hex.replace('#','').toUpperCase();
    }
    function diagramText(hex) {
      const label=colorLabel(hex);
      return /^#[0-9a-f]{6}$/i.test(label) ? label.slice(1) : label;
    }
    function drawPatternChart(startX=0,startY=0,chartWidth=size,chartHeight=chartWidth) {
      const cell=Math.max(16, Math.min(52, Math.floor(2048/Math.max(chartWidth,chartHeight))));
      const ruler=Math.max(32, Math.round(cell*.72)), titleHeight=Math.max(52, Math.round(cell*1.15)), pad=Math.max(18,Math.round(cell*.42));
      const chartW=chartWidth*cell, chartH=chartHeight*cell, width=chartW+ruler*2+pad*2, height=chartH+ruler*2+titleHeight+pad*2;
      const output=document.createElement('canvas'), o=output.getContext('2d'); output.width=width; output.height=height;
      o.fillStyle='#fffdf9'; o.fillRect(0,0,width,height);
      const left=pad+ruler, top=pad+titleHeight+ruler;
      o.fillStyle='#746c68'; o.font=`700 ${Math.max(20,Math.round(cell*.55))}px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif`;
      const range=`第 ${startX+1}–${startX+chartWidth} 欄・第 ${startY+1}–${startY+chartHeight} 列`;
      o.textAlign='left'; o.textBaseline='middle'; o.fillText(`MARD 拼豆圖稿（${range}）`,left,pad+titleHeight*.45);
      o.font=`700 ${Math.max(10,Math.round(cell*.31))}px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif`;
      o.textAlign='center'; o.textBaseline='middle'; o.fillStyle='#54504d';
      for(let i=0;i<chartWidth;i++) {
        const p=i*cell+cell/2;
        o.fillText(startX+i+1,left+p,top-ruler/2); o.fillText(startX+i+1,left+p,top+chartH+ruler/2);
      }
      for(let i=0;i<chartHeight;i++) {
        const p=i*cell+cell/2;
        o.fillText(startY+i+1,left-ruler/2,top+p); o.fillText(startY+i+1,left+chartW+ruler/2,top+p);
      }
      o.fillStyle='#fbfaf7'; o.fillRect(left,top,chartW,chartH);
      for(let y=0;y<chartHeight;y++) for(let x=0;x<chartWidth;x++) {
        const color=grid[(startY+y)*size+startX+x], px=left+x*cell, py=top+y*cell;
        if(color) {
          o.fillStyle=color; o.fillRect(px+1,py+1,cell-2,cell-2);
          const label=diagramText(color);
          o.fillStyle=textColor(color).replace('.52','.82').replace('.58','.88');
          let font=Math.max(7,Math.floor(cell/(label.length>3?3.45:2.55)));
          o.font=`800 ${font}px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif`;
          o.textAlign='center'; o.textBaseline='middle';
          o.fillText(label,px+cell/2,py+cell/2,cell-4);
        }
      }
      o.beginPath();
      for(let i=0;i<=chartWidth;i++) { const p=i*cell; o.moveTo(left+p,top); o.lineTo(left+p,top+chartH); }
      for(let i=0;i<=chartHeight;i++) { const p=i*cell; o.moveTo(left,top+p); o.lineTo(left+chartW,top+p); }
      o.strokeStyle='#b9b5af'; o.lineWidth=Math.max(1,cell*.028); o.stroke();
      o.strokeStyle='#6b6560'; o.lineWidth=Math.max(1.5,cell*.06); o.strokeRect(left,top,chartW,chartH);
      return output;
    }
    function createPatternCharts() {
      // 128 × 128 以上的作品固定分成四張，讓色號文字保有足夠大小。
      const partSize=size>=128 ? Math.ceil(size/2) : size, charts=[];
      for(let y=0;y<size;y+=partSize) for(let x=0;x<size;x+=partSize) {
        const width=Math.min(partSize,size-x), height=Math.min(partSize,size-y), section=Math.min(width,height);
        const index=charts.length+1, total=Math.ceil(size/partSize)**2;
        charts.push({canvas:drawPatternChart(x,y,width,height),filename:`我的拼豆圖稿（座標色號）-第${index}張.png`,label:total===1?'座標色號圖稿':`座標色號圖稿 ${index}／${total}（第 ${x+1}–${x+width} 欄、第 ${y+1}–${y+height} 列）`});
      }
      return charts;
    }
    function saveArtwork() {
      const output=document.createElement('canvas'), o=output.getContext('2d'), pad=64;
      output.width=output.height=canvas.width+pad*2; o.fillStyle='#fffaf5'; o.fillRect(0,0,output.width,output.height); o.drawImage(canvas,pad,pad);
      return output;
    }
    function saveChart() {
      // 手機瀏覽器常會擋掉同一次操作的多個自動下載，因此改由預覽中的每張下載連結個別儲存。
      return createPatternCharts();
    }
    document.querySelector('#saveArtwork').onclick=()=>{
      const output=saveArtwork(); showExportPreview([{canvas:output,filename:'我的拼豆作品.png',label:'拼豆作品圖'}]); toast.textContent='作品圖片已生成！'; setTimeout(()=>toast.textContent='',2400);
    };
    document.querySelector('#saveChart').onclick=()=>{
      const charts=saveChart(); showExportPreview(charts); toast.textContent=charts.length>1?'已生成 4 張分割色號圖稿！':'座標色號圖稿已生成！'; setTimeout(()=>toast.textContent='',2800);
    };
    document.querySelector('#saveBoth').onclick=()=>{
      const artwork=saveArtwork(), charts=saveChart();
      showExportPreview([{canvas:artwork,filename:'我的拼豆作品.png',label:'拼豆作品圖'},...charts]);
      toast.textContent=charts.length>1?'已生成作品圖與 4 張分割色號圖稿！':'兩張圖片已生成！'; setTimeout(()=>toast.textContent='',2800);
    };
    window.addEventListener('resize',()=>setZoom(zoom,false)); renderPalette(); const restored=restoreProject(); choose(selected); setZoom(zoom,false); if(restored) toast.textContent='已自動載入上次的作品'; loadMardPalette();
  </script>
</body>
</html>
